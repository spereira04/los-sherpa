# Configuracion por defecto. RS14: no contiene ningun secreto ni credencial.
# Todo lo sensible entra por variable de entorno (ver README).
spring:
  application:
    name: los-sherpa

  datasource:
    # La base vive fuera de cualquier directorio servido (../data respecto de /backend).
    url: jdbc:sqlite:${SHERPA_DB:../data/sherpa.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite tolera mal la escritura concurrente: una sola conexion evita SQLITE_BUSY.
      maximum-pool-size: 1
      pool-name: sherpa-pool

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Lista blanca estricta: un body con un campo que el DTO no declara (rol, id, dueno)
      # devuelve 400 en lugar de ignorarse en silencio. Anti mass assignment.
      fail-on-unknown-properties: true

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      # RS13: se desactiva el mapeo automatico /** -> classpath:/static/. Los unicos
      # patrones servibles se declaran a mano en ConfiguracionRecursosEstaticos.
      add-mappings: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

server:
  port: ${SERVER_PORT:8080}

  # RS14: ninguna respuesta de error lleva stack trace, mensaje interno ni whitelabel page.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

  servlet:
    session:
      timeout: 30m
      cookie:
        name: SHERPASESSION
        http-only: true
        # En local se sirve por http: se activa con COOKIE_SECURE=true al usar https.
        secure: ${COOKIE_SECURE:false}
        same-site: lax

sherpa:
  cors:
    # RS14: CORS restringido. En produccion local el frontend se sirve del mismo origen.
    origenes: ${CORS_ORIGENES:http://localhost:5173}
  seed:
    habilitado: false

logging:
  level:
    root: INFO
    com.lossherpa: INFO
    # Sin SQL ni parametros en el log: evita filtrar datos personales.
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
